# Counters (callgrind or perf) gate; walltime is reported and never fails,
# which halves the merge-base rounds a gate measures.
[gate]
walltime = "advisory"

[site]
name = "Corvid"
repo = "https://github.com/Verdenroz/corvid"
docs_dir = "guide"
out_dir = "site"
logo = "assets/mark.svg"
favicon = "assets/logo.svg"
extra_css = ["guide/assets/corvid.css"]

[site.theme]
primary = "#6A4FC0"
background = "#F7F5FA"

[[site.nav]]
title = "Guide"
pages = ["index.md", "setup.md", "devices.md", "apps.md", "configuration.md", "updates.md", "backups.md", "kubernetes.md", "troubleshooting.md"]

[[site.nav]]
title = "Contributing"
pages = ["development.md", "performance.md"]

[docs]
paths = ["README.md", "guide"]
package = ["corvid-config", "corvid-mirror", "corvid-rewrite", "corvid-sentinel"]

[[project]]
dir = "client"
ecosystem = "gradle"
bench_cmd = "rm -rf benchmarks/build/reports && ./gradlew :benchmarks:mainBenchmark --max-workers=2 && cp benchmarks/build/reports/benchmarks/main/*/main.json {out}"
bench_out = "benchmarks/build/soothfast-bench.json"
from = "jmh"
walltime = "hard"

[test]
ci = false
