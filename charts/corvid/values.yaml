# Rendered verbatim into the pod's /etc/corvid/config.yaml, so it follows that file's schema
# (see deploy/config.yaml). Unknown keys are refused: the config-check init container fails the
# pod with the line at fault. No secrets belong here; see `secrets`.
config:
  server:
    domain: example.com
    hostname: mail.example.com
    mail_user: alice
    acme_contact: you@elsewhere.example
    web_port: 4443
  labeler:
    jmap_url: http://127.0.0.1:8080
    jmap_user: alice@example.com
    state: /var/lib/corvid/labeler.json
    # suggest:
    #   sentinel_url: http://127.0.0.1:11333
  milter: {}
  imgproxy: {}
  sentinel:
    state: /var/lib/corvid/sentinel.json
    auth:
      state: /var/lib/corvid/auth.json
    # scribe:
    #   state: /var/lib/corvid/scribe.json

images:
  # Built from deploy/Containerfile and pushed to a registry the cluster can pull from.
  corvid:
    repository: ""
    tag: latest
  stalwart: docker.io/stalwartlabs/stalwart:v0.16.21
  unbound: docker.io/klutchell/unbound@sha256:29aee253a86810f6d9738d77f21835c4f8fdf74ee6335b7a9e152790bd2781db
  caddy: docker.io/library/caddy:2.10-alpine
  pullPolicy: IfNotPresent

secrets:
  # Name an existing Secret with the keys below instead of having the chart create one.
  existingSecret: ""
  # Used only when existingSecret is empty.
  values:
    # openssl rand -hex 32. The milter and image proxy share it.
    CORVID_IMGPROXY_SECRET: ""
    # Cloudflare API token for DNS records and DNS-01 certificates.
    cloudflare.token: ""
    # user:password. Removed after the first-run bootstrap; see the chart README.
    STALWART_RECOVERY_ADMIN: ""
    # An app password for the labeler, created once Stalwart is running.
    CORVID_JMAP_PASSWORD: ""
    # openssl rand -hex 32. The plan's WebHook signs with it; the sentinel verifies with it.
    CORVID_SENTINEL_SECRET: ""
    # openssl rand -hex 32. Needed only with labeler.suggest and sentinel.scribe in config.
    CORVID_SCRIBE_SECRET: ""

# Off until an app password exists for it: see the chart README.
labeler:
  enabled: false

# On by default, unlike the labeler: the plan's WebHook is a static, unconditional entry in
# stalwart.plan.ndjson (applied by deploy/apply-plan.sh, not templated per Values), so turning
# this off leaves it posting to a container that does not exist.
sentinel:
  enabled: true

service:
  type: LoadBalancer
  # Local keeps the sender's IP visible to Stalwart, which SPF and the spam filter depend on.
  externalTrafficPolicy: Local
  loadBalancerIP: ""
  annotations: {}

# Admits only the public mail and web ports. Stalwart's plain HTTP listener and unbound bind
# every pod address, and the setup endpoint is unauthenticated until the plan is applied.
networkPolicy:
  enabled: true

persistence:
  size: 20Gi
  storageClass: ""
  existingClaim: ""

resources:
  mail:
    requests: {memory: 550Mi}
    limits: {memory: 650Mi}
  milter:
    requests: {memory: 64Mi}
    limits: {memory: 384Mi}
  imgproxy:
    requests: {memory: 32Mi}
    limits: {memory: 256Mi}
  labeler:
    requests: {memory: 32Mi}
    limits: {memory: 256Mi}
  sentinel:
    requests: {memory: 32Mi}
    limits: {memory: 256Mi}
  caddy:
    requests: {memory: 32Mi}
    limits: {memory: 256Mi}
  unbound:
    requests: {memory: 16Mi}
    limits: {memory: 128Mi}
