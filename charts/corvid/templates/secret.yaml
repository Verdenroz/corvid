{{- if not .Values.secrets.existingSecret }}
{{- $v := .Values.secrets.values }}
{{- $_ := required "secrets.values.CORVID_IMGPROXY_SECRET is required (openssl rand -hex 32)" (index $v "CORVID_IMGPROXY_SECRET") }}
{{- $_ := required "secrets.values.cloudflare.token is required" (index $v "cloudflare.token") }}
{{- /* The mail container reads this unconditionally, since the plan's WebHook is a static entry
   posted regardless of sentinel.enabled; a missing key here would fail that container's start. */}}
{{- $_ := required "secrets.values.CORVID_SENTINEL_SECRET is required (openssl rand -hex 32)" (index $v "CORVID_SENTINEL_SECRET") }}
{{- if .Values.labeler.enabled }}
{{- $_ := required "secrets.values.CORVID_JMAP_PASSWORD is required when labeler.enabled" (index $v "CORVID_JMAP_PASSWORD") }}
{{- end }}
{{- if .Values.sentinel.enabled }}
{{- $_ := required "secrets.values.CORVID_SENTINEL_JMAP_PASSWORD is required when sentinel.enabled" (index $v "CORVID_SENTINEL_JMAP_PASSWORD") }}
{{- end }}
{{- if .Values.idp.enabled }}
{{- $_ := required "secrets.values.ENCRYPTION_KEY is required when idp.enabled" (index $v "ENCRYPTION_KEY") }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "corvid.secret" . }}
  labels:
    {{- include "corvid.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $v }}
  {{- if $value }}
  {{ $key | quote }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
