    <line x1="820" y1="145" x2="820" y2="195" stroke="#15111D" stroke-width="4"/>
    <text x="820" y="222" font-size="18" fill="#8F76DD" text-anchor="middle">milter</text>

    <circle cx="940" cy="170" r="11" fill="none" stroke="#15111D" stroke-width="3"/>
    <rect x="936" y="167" width="8" height="7" fill="#15111D"/>
