<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Corvid</title>
  <desc id="hero-desc">Mail arrives, the milter strips trackers at delivery, images route through a signed proxy, and the message lands in a mailbox on its own IP.</desc>

  <rect width="1200" height="340" rx="28" fill="#6A4FC0"/>

  <g id="title-block" fill="#C9C3D6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="64" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="20" letter-spacing="2" fill="#C9C3D6">SELF-HOSTED EMAIL, ONE MAILBOX</text>
    <text x="62" y="152" font-size="84" font-weight="700" fill="#EEEBF2">Corvid</text>
    <text x="64" y="200" font-size="24" fill="#C9C3D6">Mail arrives, trackers get stripped at delivery,</text>
    <text x="64" y="228" font-size="24" fill="#C9C3D6">and it never leaves your own IP.</text>
    <text x="64" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#8F76DD">MIT license · Stalwart Mail Server · Rust services</text>
  </g>

