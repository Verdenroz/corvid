<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">The delivery path, and everything off it</title>
  <desc id="workflow-desc">Mail flows sender to Stalwart to the milter to the mailbox on one path that defers mail at the sender if it breaks. The labeler and the mirror pull from the mailbox off that path, so a failure there only makes labels or the mirror late.</desc>

  <rect width="1200" height="400" rx="28" fill="#6A4FC0"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8F76DD">
    <text x="64" y="52" font-size="18" letter-spacing="2">ARCHITECTURE</text>
  </g>
  <text x="64" y="86" font-size="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" fill="#EEEBF2" font-weight="700">The delivery path, and everything off it</text>

  <g id="delivery-path" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="64" y="140" width="120" height="52" rx="10" fill="none" stroke="#15111D" stroke-width="2.5"/>
    <text x="124" y="172" font-size="18" fill="#EEEBF2" text-anchor="middle">sender</text>

    <line x1="184" y1="166" x2="246" y2="166" stroke="#15111D" stroke-width="3"/>
    <path d="M238 158 L250 166 L238 174" fill="#15111D"/>

    <rect x="250" y="140" width="172" height="52" rx="10" fill="none" stroke="#15111D" stroke-width="2.5"/>
    <text x="336" y="172" font-size="17" fill="#EEEBF2" text-anchor="middle">stalwart · DATA</text>

    <line x1="422" y1="166" x2="484" y2="166" stroke="#15111D" stroke-width="3"/>
    <path d="M476 158 L488 166 L476 174" fill="#15111D"/>

    <rect x="488" y="128" width="240" height="76" rx="10" fill="none" stroke="#15111D" stroke-width="2.5"/>
    <text x="608" y="160" font-size="19" fill="#EEEBF2" text-anchor="middle" font-weight="700">milter</text>
    <text x="608" y="184" font-size="15" fill="#EEEBF2" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">tempFailOnError: true</text>

    <line x1="728" y1="166" x2="800" y2="166" stroke="#15111D" stroke-width="3"/>
    <path d="M792 158 L804 166 L792 174" fill="#15111D"/>

    <rect x="804" y="118" width="164" height="96" rx="12" fill="#15111D"/>
    <text x="886" y="172" font-size="20" fill="#EEEBF2" text-anchor="middle" font-weight="700">mailbox</text>
  </g>

  <text x="64" y="238" font-size="16" fill="#C9C3D6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">Down here, mail is deferred at the sender: never accepted unstripped.</text>

  <line x1="886" y1="214" x2="886" y2="270" stroke="#8F76DD" stroke-width="2.5" stroke-dasharray="2 6"/>

  <g id="off-path" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <line x1="700" y1="270" x2="886" y2="270" stroke="#8F76DD" stroke-width="2.5" stroke-dasharray="2 6"/>
    <line x1="886" y1="270" x2="1060" y2="270" stroke="#8F76DD" stroke-width="2.5" stroke-dasharray="2 6"/>
    <line x1="700" y1="270" x2="700" y2="298" stroke="#8F76DD" stroke-width="2.5" stroke-dasharray="2 6"/>
    <line x1="1060" y1="270" x2="1060" y2="298" stroke="#8F76DD" stroke-width="2.5" stroke-dasharray="2 6"/>

    <rect x="600" y="298" width="200" height="52" rx="10" fill="none" stroke="#8F76DD" stroke-width="2.5"/>
    <text x="700" y="330" font-size="16" fill="#EEEBF2" text-anchor="middle">labeler · polls JMAP</text>

    <rect x="960" y="298" width="200" height="52" rx="10" fill="none" stroke="#8F76DD" stroke-width="2.5"/>
    <text x="1060" y="330" font-size="16" fill="#EEEBF2" text-anchor="middle">mirror · nightly JMAP</text>
  </g>

  <text x="64" y="385" font-size="16" fill="#C9C3D6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">Off the path: when they fail, labels or the mirror run late, but mail still arrives.</text>
</svg>
