name: release

# Runs after `image` on a release tag, so the apps it attaches are the ones that image carries.
# `image` is also called from ci.yml, whose grant cannot widen to contents: write.
on:
  workflow_run:
    workflows: [image]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  attach:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: corvid-app
          path: app
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --generate-notes "${prerelease[@]}" \
            app/corvid.apk app/corvid-linux-x64.tar.gz scripts/install-desktop.sh
