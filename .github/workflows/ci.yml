name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request makes the older run's result moot.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A required job skipped by its `if` still satisfies the branch ruleset, so each area's jobs run
  # only when the change can affect them, and every job runs when this filter itself did not succeed.
  # The Rust tests read deploy/ and charts/, hence their paths.
  changes:
    runs-on: [self-hosted, linux, x64, corvid]
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      deploy: ${{ steps.filter.outputs.deploy }}
      client: ${{ steps.filter.outputs.client }}
      chart: ${{ steps.filter.outputs.chart }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3.0.2
        id: filter
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
            rust:
              - *ci
              - crates/**
              - Cargo.toml
              - Cargo.lock
              - deploy/**
              - charts/**
              - .dockerignore
            deploy:
              - *ci
              - deploy/**
              - scripts/**
              - crates/corvid-sentinel/**
              - crates/corvid-config/**
              - Cargo.lock
            client:
              - *ci
              - client/**
            chart:
              - *ci
              - charts/**

  rust:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: [self-hosted, linux, x64, corvid]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  sentinel:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.deploy == 'true') }}
    runs-on: [self-hosted, linux, x64, corvid]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p corvid-sentinel --locked
      - uses: actions/upload-artifact@v4
        with:
          name: corvid-sentinel
          path: target/debug/corvid-sentinel
          retention-days: 1

  deploy:
    needs: [changes, sentinel]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.deploy == 'true') }}
    runs-on: [self-hosted, linux, x64, corvid]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: corvid-sentinel
          path: sentinel
      - run: shellcheck -S warning deploy/*.sh deploy/tests/*.sh scripts/*.sh
      - run: bash deploy/tests/bootstrap-server.test.sh
      - run: bash deploy/tests/apply-plan.test.sh
      - run: bash deploy/tests/install.test.sh
      - run: bash deploy/tests/cloudflare.test.sh
      - run: bash deploy/tests/mta-sts-lib.test.sh
      - run: bash deploy/tests/idp-hostname.test.sh
      - run: bash deploy/tests/idp-dns-lib.test.sh
      - run: bash deploy/tests/srv-dns-lib.test.sh
      - run: bash deploy/tests/set-password.test.sh
      - run: bash deploy/tests/device.test.sh
      - run: bash deploy/tests/totp.test.sh
      - run: bash deploy/tests/lib.test.sh
      - run: bash deploy/tests/update.test.sh
      - run: bash deploy/tests/apps.test.sh
      - run: bash deploy/tests/install-desktop.test.sh
      - run: bash deploy/tests/caddy.test.sh
      - run: bash scripts/app-manifest.test.sh
      - name: Install stalwart-cli
        run: |
          url=https://github.com/stalwartlabs/cli/releases/download/v1.0.12/stalwart-cli-x86_64-unknown-linux-musl.tar.xz
          curl -fsSL -o cli.tar.xz "$url"
          echo "76fcd7250a10c7bee704dc4a08000b3faca6b5a22895d41831c0c37efd95acce  cli.tar.xz" | sha256sum -c --quiet
          tar -xJf cli.tar.xz
          sudo install -m 755 stalwart-cli-x86_64-unknown-linux-musl/stalwart-cli /usr/local/bin/stalwart-cli
      - run: chmod +x sentinel/corvid-sentinel
      - run: bash deploy/tests/oidc.test.sh
        env:
          CORVID_SENTINEL_BIN: ${{ github.workspace }}/sentinel/corvid-sentinel
      - name: Install python3 cryptography
        run: python3 -I -c 'import cryptography' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y python3-cryptography; }
      - run: bash deploy/tests/push.test.sh
        env:
          CORVID_SENTINEL_BIN: ${{ github.workspace }}/sentinel/corvid-sentinel
      - run: cat deploy/stalwart.plan.ndjson deploy/stalwart.host-zone.ndjson > combined.ndjson && ./deploy/check-plan.py combined.ndjson
      - run: ./deploy/check-plan.py
      - run: ./deploy/check-env.sh
      - run: ./deploy/check-sentinel-events.sh

  # Release packaging (assembleRelease, createDistributable) runs once per main push in image.yml.
  client:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.client == 'true') }}
    runs-on: [self-hosted, linux, x64, corvid]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check :androidApp:assembleDebug :desktopApp:compileKotlin --max-workers=2

  chart:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.chart == 'true') }}
    runs-on: [self-hosted, linux, x64, corvid]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: Lint, render and validate
        run: |
          set -- --set images.corvid.repository=ghcr.io/example/corvid \
                 --set secrets.values.CORVID_IMGPROXY_SECRET=x \
                 --set secrets.values.CORVID_SENTINEL_SECRET=x \
                 --set-string 'secrets.values.cloudflare\.token=x'
          helm lint charts/corvid "$@"
          helm template ci charts/corvid "$@" --set labeler.enabled=true --set idp.enabled=true \
            --set secrets.values.CORVID_JMAP_PASSWORD=x --set secrets.values.ENCRYPTION_KEY=x > rendered.yaml
          test "$(grep -c '^kind:' rendered.yaml)" -gt 0
          kubeconform -strict -summary rendered.yaml
