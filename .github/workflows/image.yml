name: image

# A main push publishes only through ci.yml, once every check it ran passed. ci.yml never runs on
# a tag, so a release tag publishes from here directly.
on:
  push:
    tags: ["v*"]
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  client-release:
    runs-on: [self-hosted, linux, x64, corvid]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: client
        run: echo "VERSION_CODE=$((1000 + $(git rev-list --count HEAD -- .)))" >> "$GITHUB_ENV"
      - name: Decode the release keystore
        run: echo "$CORVID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/corvid-release.jks"
        env:
          CORVID_KEYSTORE: ${{ secrets.CORVID_KEYSTORE }}
      - name: Build the release apps
        working-directory: client
        run: ./gradlew :androidApp:assembleRelease :desktopApp:createDistributable -Pcorvid.versionCode="$VERSION_CODE" --max-workers=2
        env:
          CORVID_KEYSTORE_FILE: ${{ runner.temp }}/corvid-release.jks
          CORVID_KEYSTORE_PASSWORD: ${{ secrets.CORVID_KEYSTORE_PASSWORD }}
          CORVID_KEY_ALIAS: ${{ secrets.CORVID_KEY_ALIAS }}
          CORVID_KEY_PASSWORD: ${{ secrets.CORVID_KEY_PASSWORD }}
      - name: Collect and verify the apps
        run: |
          mkdir app
          cp client/androidApp/build/outputs/apk/release/*.apk app/corvid.apk
          "$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)" verify --print-certs app/corvid.apk
          tar -C client/desktopApp/build/compose/binaries/main/app -czf app/corvid-linux-x64.tar.gz corvid
          ./scripts/app-manifest.py app "$VERSION_CODE"
      - uses: actions/upload-artifact@v4
        with:
          name: corvid-app
          path: app
          retention-days: 1

  publish:
    needs: client-release
    runs-on: [self-hosted, linux, x64, corvid]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: corvid-app
          path: dist/app
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/corvid
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=ref,event=branch
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
