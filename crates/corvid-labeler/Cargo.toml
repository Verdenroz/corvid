[package]
name = "corvid-labeler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23.1"
corvid-config.workspace = true
corvid-ingest.workspace = true
corvid-jmap = { version = "0.1.0", path = "../corvid-jmap" }
corvid-label.workspace = true
corvid-store.workspace = true
ctrlc = { version = "3.5.2", features = ["termination"] }
hex = "0.4.3"
hmac = "0.13.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
