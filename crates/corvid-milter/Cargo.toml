[package]
name = "corvid-milter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
corvid-config.workspace = true
corvid-mime.workspace = true
corvid-sign.workspace = true
corvid-rewrite.workspace = true
indymilter = "0.3.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
