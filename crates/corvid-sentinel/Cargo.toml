[package]
name = "corvid-sentinel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
corvid-config.workspace = true
corvid-store.workspace = true
hex = "0.4.3"
hmac = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "fs", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["net"] }
