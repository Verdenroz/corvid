[package]
name = "corvid-sentinel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
soft-authenticator = []

[[example]]
name = "soft-authenticator"
required-features = ["soft-authenticator"]

[dependencies]
aes-gcm = "0.11.1"
axum = "0.8.9"
base64 = "0.23.1"
ciborium = "0.2.2"
corvid-config.workspace = true
corvid-ingest.workspace = true
corvid-sign.workspace = true
corvid-store.workspace = true
futures-util = { version = "0.3.34", default-features = false }
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "fs", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
corvid-sentinel = { path = ".", features = ["soft-authenticator"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["net"] }
