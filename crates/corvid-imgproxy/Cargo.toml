[package]
name = "corvid-imgproxy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
corvid-config.workspace = true
corvid-sign.workspace = true
axum = "0.8.9"
bytes = "1.12.1"
lru = "0.18.4"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
corvid-config = { path = "../corvid-config" }
corvid-rewrite = { path = "../corvid-rewrite" }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net"] }
