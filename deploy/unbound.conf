# DNSSEC-validating resolver for the pod. Stalwart disables DANE unless its
# resolver validates DNSSEC and is reachable over TCP; provider resolvers
# generally are neither.
server:
    # Container essentials: unbound otherwise forks, chroots, drops to a user
    # that does not exist in a distroless image, and logs to syslog.
    do-daemonize: no
    username: ""
    chroot: ""
    directory: "/etc/unbound"
    logfile: ""
    use-syslog: no
    pidfile: ""
    so-sndbuf: 0

    # 0.0.0.0 inside the pod namespace means the pod's loopback and its bridge
    # address, nothing else; the only route in is the loopback-only publish.
    interface: 0.0.0.0@5335
    access-control: 127.0.0.0/8 allow
    access-control: 10.88.0.0/16 allow

    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    harden-dnssec-stripped: yes
    val-clean-additional: yes
    prefetch: yes
    cache-min-ttl: 60
    cache-max-ttl: 86400
    edns-buffer-size: 1232
    hide-identity: yes
    hide-version: yes
