# Corvid configuration, read from /etc/corvid/config.yaml (or the path in CORVID_CONFIG).
# bootstrap.sh installs this as /opt/corvid/config.yaml once; edit it there.
# No secrets belong here. Each service reads its own from an environment variable:
#   CORVID_JMAP_PASSWORD     labeler, scribe and mirror, an app password each
#   CORVID_IMGPROXY_SECRET   milter and image proxy, the same value in both
#   CORVID_SCRIBE_SECRET     labeler, scribe and sentinel, the same value in all three
#   CORVID_SENTINEL_SECRET   sentinel and Stalwart's own WebHook, the same value in both
# Unknown keys are refused, so a misspelt setting stops the service instead of being ignored.

# The deployment, read by the deploy scripts. After changing web_port, rerun bootstrap.sh so the
# firewall opens the new port.
server:
  domain: example.com
  # The name the server announces itself as. Its A record and the IP's PTR must agree.
  hostname: mail.example.com
  # Local part only: alice, not alice@example.com.
  mail_user: alice
  # Let's Encrypt's contact. Use an address outside this server.
  acme_contact: you@elsewhere.example
  # Where the web tier (JMAP, image proxy, passkeys) answers. 443 works if nothing else holds it.
  web_port: 4443
  # Only when hostname lies outside domain, e.g. a host named n1.example.net serving mail for
  # example.com. Stalwart then keeps a certificate for this zone and publishes no records in it.
  # host_zone: example.net
  # The Android apps that may sign in with a passkey, by package and the SHA-256 of the
  # certificate that signs them. The default is the published app; a list of your own replaces it,
  # so keep the published entry too if you want both. Served as /.well-known/assetlinks.json on the mail domain.
  # android_apps:
  #   - package: com.example.corvid
  #     sha256: 00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF
  # Who may reach the ports mail apps use (465, 587, 993 and web_port): anywhere; host, meaning
  # only programs on this server such as a VPN it runs; or a list like [192.0.2.0/24].
  # Ports 25 and 80 stay open to everyone, since other mail servers and Let's Encrypt need them.
  client_access: anywhere
  # Whether the MTA-STS policy tells senders to test or enforce TLS, however it is served
  # (Stalwart on 443, a Cloudflare Worker otherwise). Start with testing; switch once mail
  # delivery looks right.
  # mta_sts_mode: testing

# Whether this host pulls the release its image tag points at every night, deploys it and rolls
# back when verify fails. Set false to update by hand with install.sh.
update:
  auto: true

labeler:
  jmap_url: http://127.0.0.1:8080
  jmap_user: alice@example.com
  state: /var/lib/corvid/labeler.json
  interval_secs: 60

  # Optional: labels senders the labeler has not seen yet. Delete this block to run without a
  # model. Any OpenAI-compatible chat endpoint that returns logprobs works.
  model:
    url: http://10.0.0.2:8080/v1/chat/completions
    name: qwen3.6:35b-a3b
    # Percent a choice must reach before its label is written.
    confidence: 80
    # Messages per pass. Each costs one call per label, plus one.
    budget: 20
    deadline_secs: 300
    interval_secs: 3600
    # Fields merged into every request. Qwen3-family models need thinking turned off, or the
    # one token they are allowed goes to the thinking block.
    request_extra:
      chat_template_kwargs:
        enable_thinking: false

  # Posts the rule suggestions it mines to the sentinel. Needs sentinel.scribe and the same
  # CORVID_SCRIBE_SECRET in both services. Delete it to post nothing.
  suggest:
    sentinel_url: http://127.0.0.1:11333

# Summaries of long threads, written by a model and stored by the sentinel. Needs sentinel.scribe.
# Delete this block to run none; the unit stays masked while it is absent.
scribe:
  jmap_url: http://127.0.0.1:8080
  jmap_user: alice@example.com
  state: /var/lib/corvid/scribe.state
  sentinel_url: http://127.0.0.1:11333
  interval_secs: 300
  # Mailboxes to leave out by name or role, besides Junk and Trash.
  exclude_mailboxes: []
  # A thread is summarized with this many messages, or when one body passes long_body_chars.
  min_messages: 3
  long_body_chars: 3000
  # Thread text sent to the model; the oldest messages are cut first.
  max_input_chars: 12000
  model:
    url: http://10.0.0.2:8080/v1/chat/completions
    name: qwen3.6:35b-a3b
    max_tokens: 300
    # Threads per pass.
    budget: 10
    deadline_secs: 300
    request_extra:
      chat_template_kwargs:
        enable_thinking: false

milter:
  bind: 127.0.0.1:11332
  # The origin image URLs point at, by default https://<server.hostname>:<server.web_port>.
  # The milter appends /i/. Changing it breaks images in mail already delivered.
  # proxy_base: https://mail.example.com:4443

imgproxy:
  bind: 127.0.0.1:8081
  max_bytes: 5242880
  cache_entries: 512

# Read on the machine that keeps the archive, not on the mail host.
mirror:
  jmap_url: https://mail.example.com:4443
  jmap_user: alice@example.com
  root: /var/lib/corvid-mirror
  # Public age recipient the nightly mirror encrypts bodies and the ledger to. Generate a
  # real one with age-keygen; keep its identity offline, off this host, for verify --deep
  # and restore. This placeholder is the age project's own published test key.
  age_recipient: age1t7rxyev2z3rw82stdlrrepyc39nvn86l5078zqkf5uasdy86jp6svpy7pa

sentinel:
  bind: 127.0.0.1:11333
  state: /var/lib/corvid/sentinel.json
  # Approving a new device with a passkey that approves devices. Needs CORVID_STALWART_TOKEN.
  devices:
    state: /var/lib/corvid/devices.json
  # Passkey sign-in: the sentinel issues the tokens Stalwart trusts. Set up the first passkey with
  # deploy/passkey.sh code; deploy.sh switches Stalwart over once a passkey approves devices.
  auth:
    state: /var/lib/corvid/auth.json
  # New-mail previews (sender, subject, a snippet) encrypted to each approved device, sent
  # through Google's push service or the device's own connection to this server. Needs devices.
  # Delete it to push nothing.
  push: {}
  # Stores the labeler's rule suggestions and serves them to the app. Needs CORVID_SCRIBE_SECRET.
  # Delete it to serve none.
  scribe:
    state: /var/lib/corvid/scribe.json
